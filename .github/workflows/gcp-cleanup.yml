# GCS·Artifact Registry·로그 보존 정리 (수동 실행 — GCP API 호출 있음)
name: 🧹 GCP artifact cleanup

on:
  workflow_dispatch:
    inputs:
      keep_images:
        description: 'Artifact Registry 보존 이미지 수'
        required: false
        default: '5'
      log_retention_days:
        description: 'Cloud Logging 보존 일수'
        required: false
        default: '14'

concurrency:
  group: gcp-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      KEEP_IMAGES: ${{ inputs.keep_images }}
      LOG_RETENTION_DAYS: ${{ inputs.log_retention_days }}

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: 🧹 Run cleanup script
        run: bash scripts/gcp-cleanup-artifacts.sh
